name: MINIGAMES 26.1.2

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile MINIGAMES 26.1.2
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Extract MINIGAMES source
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -iname 'MINIGAMES_SOURCE_26.1.2*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo 'ERROR: MINIGAMES 26.1.2 source ZIP not found'
            exit 1
          fi
          unzip -q "$ZIP" -d source
          BUILD_FILE=$(find source -type f -name build.gradle -o -name build.gradle.kts | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo 'ERROR: Gradle build file not found inside source ZIP'
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Compile MINIGAMES
        run: |
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon

      - name: Upload MINIGAMES JAR
        uses: actions/upload-artifact@v4
        with:
          name: MINIGAMES-MOD-26.1.2
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
          
