name: Extract and Compile Minigames

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP found!"
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source

          echo "Extracted files:"
          find source -maxdepth 3 -type f

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          GRADLE_FILE=$(find source -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build source
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Minigames-Build
          path: |
            source/**/build/libs/*.jar
          if-no-files-found: warn
